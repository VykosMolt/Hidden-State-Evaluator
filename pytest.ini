[pytest]
addopts =
    -p no:cacheprovider
testpaths =
    shared/utilities/tests
pythonpath =
    shared
    shared/src
python_files =
    test_*.py
    *_test.py
norecursedirs =
    archive
    .git
    .venv
    venv
    __pycache__
    runs
    compat
    data
    artifacts
    browser_profiles
